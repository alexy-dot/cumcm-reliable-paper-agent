name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/production/run.py --output runs/demo
  numerical-kernels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2'
      - run: python -m unittest discover -s benchmarks/furnace_2020a -p 'test_*.py' -v
      - run: python -m unittest discover -s benchmarks/casting_2021d -p 'test_*.py' -v
  paper-rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-paper.txt
      - run: python -m unittest discover -s tests -p 'test_render_paper.py' -v
      - run: python -m unittest discover -s tests -p 'test_paper_structure.py' -v
  grouped-statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/ethanol_2021b/requirements.txt
      - run: python -m unittest discover -s benchmarks/ethanol_2021b -p 'test_*.py' -v
  submission-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-submission.txt
      - run: python -m unittest discover -s tests -p 'test_submission.py' -v
  unified-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-all.txt -c constraints-python312.txt
      - run: python -m pip check
      - run: python skill/cumcm-reliable-paper/scripts/cumcm_agent.py doctor --profile statistics --profile submission
      - run: python -m unittest discover -s tests -q
      - run: python -m unittest discover -s benchmarks/furnace_2020a -p 'test_*.py' -q
      - run: python -m unittest discover -s benchmarks/casting_2021d -p 'test_*.py' -q
      - run: python -m unittest discover -s benchmarks/ethanol_2021b -p 'test_*.py' -q
